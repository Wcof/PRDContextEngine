name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate PMSkill structure
        run: |
          python3 scripts/validate_pmskill.py

      - name: Run runtime and repository gates
        run: |
          python3 -m unittest tests.test_post_generation_hook tests.test_repository_contract -v

      - name: Run eval structural checks
        run: |
          bash evals/run-evals.sh --dry-run
